name: Test and deploy Cloudflare Pages

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: Zielumgebung
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  test-suiten:
    name: test-suiten
    runs-on: ubuntu-latest
    concurrency:
      group: kd-test-suiten-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - run: npm ci
      - run: npm test
      - run: npm run test:function

  test-mobile:
    name: test-mobile (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    concurrency:
      group: kd-test-mobile-${{ matrix.browser }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright-Browser cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ matrix.browser }}
      - name: Browser und Systembibliotheken sicherstellen
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:mobile -- --project=${{ matrix.browser }}

  # Stabiler Required Check: behält den bisherigen Namen `test` und schlägt
  # auch dann fehl, wenn ein vorgeschalteter Job abgebrochen oder übersprungen wurde.
  test:
    name: test
    if: ${{ always() }}
    needs: [test-suiten, test-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Alle Testzweige müssen grün sein
        env:
          SUITEN_RESULT: ${{ needs.test-suiten.result }}
          MOBILE_RESULT: ${{ needs.test-mobile.result }}
        run: |
          if [ "$SUITEN_RESULT" != "success" ] || [ "$MOBILE_RESULT" != "success" ]; then
            echo "Testzweige: Suiten=$SUITEN_RESULT, Mobile=$MOBILE_RESULT"
            exit 1
          fi

  deploy-staging:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: kinodreieck-cloudflare-pages-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_TARGET: staging
      VITE_APP_ENV: staging
      VITE_APP_URL: ${{ vars.APP_URL }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_AI_ENDPOINT_NAME: ${{ vars.AI_ENDPOINT_NAME }}
      VITE_RADAR_PILOT_CLIENT_ENABLED: ${{ vars.STAGING_RADAR_PILOT_CLIENT_ENABLED == 'true' && 'true' || 'false' }}
      VITE_PRIVATE_SELF_SERVICE_ENABLED: ${{ vars.STAGING_PRIVATE_SELF_SERVICE_ENABLED == 'true' && 'true' || 'false' }}
      VITE_ACCOUNT_DELETE_ENABLED: "false"
      VITE_BUILD_VERSION: ${{ github.sha }}
      EXPECTED_BUILD_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:deploy-env
      - run: npm run build:online
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.102.0"
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=staging
            --commit-hash=${{ github.sha }}
      - name: Atomic deployment prüfen
        env:
          APP_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run check:remote
      - name: Staging-Domain prüfen
        env:
          APP_URL: ${{ vars.APP_URL }}
          SMOKE_RETRY_BUILD_META: "1"
        run: npm run check:remote

  deploy-production:
    if: >-
      github.ref_name == 'main' &&
      ((github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: kinodreieck-cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_TARGET: production
      VITE_APP_ENV: production
      VITE_APP_URL: ${{ vars.APP_URL }}
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_AI_ENDPOINT_NAME: ${{ vars.AI_ENDPOINT_NAME }}
      VITE_RADAR_PILOT_CLIENT_ENABLED: "false"
      VITE_PRIVATE_SELF_SERVICE_ENABLED: "false"
      VITE_ACCOUNT_DELETE_ENABLED: "false"
      VITE_BUILD_VERSION: ${{ github.sha }}
      EXPECTED_BUILD_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:deploy-env
      - run: npm run build:online
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.102.0"
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
      - name: Atomic deployment prüfen
        env:
          APP_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run check:remote
      - name: Produktions-Domain prüfen
        env:
          APP_URL: ${{ vars.APP_URL }}
          SMOKE_RETRY_BUILD_META: "1"
        run: npm run check:remote
