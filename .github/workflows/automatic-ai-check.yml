name: Automatic AI six-hour checker

on:
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: kinodreieck-automatic-ai-check
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Repository-Opt-in ausweisen
        env:
          SCHEDULE_ENABLED: ${{ vars.KD_AUTOMATIC_AI_SCHEDULE_ENABLED == 'true' && 'true' || 'false' }}
        run: |
          if [ "$SCHEDULE_ENABLED" = "true" ]; then
            state="aktiviert"
            detail="Der kostenpflichtige Automatic-AI-Zeitplan darf den fälligen Check starten."
          else
            state="wirkungsgesperrt"
            detail="KD_AUTOMATIC_AI_SCHEDULE_ENABLED ist nicht exakt true; es wurde kein Anbieterrequest gestartet."
          fi
          {
            echo "## Automatic AI: ${state}"
            echo
            echo "$detail"
          } >> "$GITHUB_STEP_SUMMARY"

  due-check:
    needs: activation
    if: ${{ vars.KD_AUTOMATIC_AI_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - name: Bis zu drei faellige automatische KI-Jobs seriell pruefen
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_RADAR_SCHEDULER: ${{ secrets.SUPABASE_RADAR_SCHEDULER }}
        run: |
          set -euo pipefail
          summary() {
            {
              echo "## Automatic AI: $1"
              echo
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          fail() {
            echo "::error title=Automatic AI::$1"
            summary "Störung" "$1"
            exit 1
          }
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_RADAR_SCHEDULER" ]; then
            fail "SUPABASE_URL oder SUPABASE_RADAR_SCHEDULER fehlt im staging-Environment."
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) fail "SUPABASE_URL hat nicht das erwartete Supabase-HTTPS-Format." ;;
          esac
          case "$SUPABASE_RADAR_SCHEDULER" in
            sb_secret_*) ;;
            *) fail "SUPABASE_RADAR_SCHEDULER hat nicht das erwartete Secret-Key-Format." ;;
          esac

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! response_meta="$(
            curl --silent --show-error \
              --request POST \
              --connect-timeout 10 \
              --max-time 240 \
              --output "$response_file" \
              --write-out "%{http_code} %{content_type}" \
              "${SUPABASE_URL%/}/functions/v1/automatic-ai-check" \
              --header "apikey: ${SUPABASE_RADAR_SCHEDULER}" \
              --header "x-kd-automatic-check: scheduled-v1"
          )"; then
            fail "Automatic-AI-Checker war innerhalb des Zeitlimits nicht erreichbar; es erfolgt kein Workflow-Retry."
          fi
          http_status="${response_meta%% *}"
          content_type="${response_meta#* }"
          if [ "$http_status" != "200" ] || [[ "$content_type" != application/json* ]]; then
            fail "Automatic-AI-Checker lieferte keinen sicheren Erfolg (HTTP ${http_status}); es erfolgt kein Workflow-Retry."
          fi
          if ! outcome="$(node -e '
            const { readFileSync } = require("node:fs");
            let body;
            try { body = JSON.parse(readFileSync(process.argv[1], "utf8")); }
            catch { process.exit(2); }
            const keys = Object.keys(body || {}).sort().join(",");
            const expected = [
              "code", "initialSucceededJobs", "maxJobs", "ok", "oldestLagSeconds",
              "processedJobs", "remainingDueJobs", "retryFinishedJobs", "stopReason", "timeBudgetMs",
            ].sort().join(",");
            const codes = new Set(["idle", "drained", "backlog"]);
            const stopReasons = new Set(["idle", "job_limit", "time_budget"]);
            const countersValid = Number.isInteger(body?.processedJobs)
              && body.processedJobs >= 0 && body.processedJobs <= 3
              && Number.isInteger(body?.initialSucceededJobs) && body.initialSucceededJobs >= 0
              && Number.isInteger(body?.retryFinishedJobs) && body.retryFinishedJobs >= 0
              && body.initialSucceededJobs + body.retryFinishedJobs === body.processedJobs
              && Number.isInteger(body?.remainingDueJobs) && body.remainingDueJobs >= 0
              && body.remainingDueJobs <= 1000000
              && (body.oldestLagSeconds === null
                || (Number.isInteger(body.oldestLagSeconds) && body.oldestLagSeconds >= 0));
            const stateValid = (body?.remainingDueJobs === 0) === (body?.oldestLagSeconds === null)
              && (body?.code === "backlog") === (body?.remainingDueJobs > 0)
              && (body?.code === "idle") === (body?.processedJobs === 0);
            if (keys !== expected || body.ok !== true || !codes.has(body.code)
                || !stopReasons.has(body.stopReason) || !countersValid || !stateValid
                || body.maxJobs !== 3 || body.timeBudgetMs !== 225000) process.exit(3);
            process.stdout.write(JSON.stringify({
              code: body.code,
              processedJobs: body.processedJobs,
              remainingDueJobs: body.remainingDueJobs,
              oldestLagSeconds: body.oldestLagSeconds,
              stopReason: body.stopReason,
            }));
          ' "$response_file")"; then
            fail "Automatic-AI-Checker lieferte keinen gültigen Antwortvertrag."
          fi
          if [[ "$outcome" == *'"code":"backlog"'* ]]; then
            echo "::warning title=Automatic AI: Rückstand::Der Checker meldet nach höchstens drei seriellen Jobs weiteren Rückstand."
            summary "Rückstand" "Der Checker war erfolgreich, meldet aber nach höchstens drei seriellen Jobs weiteren Rückstand: ${outcome}."
          else
            echo "Automatic-AI-Checker: ${outcome}."
            summary "OK" "Der fällige Check endete mit gültigem Vertrag: ${outcome}."
          fi
