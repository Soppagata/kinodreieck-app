name: Supabase Keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Oeffentlichen Supabase-Auth-Health-Vertrag pruefen
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY nicht gesetzt."; exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "Supabase-URL ist ungueltig."; exit 1 ;;
          esac

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          response_meta="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --output "$response_file" \
              --write-out "%{http_code} %{content_type}" \
              "${SUPABASE_URL%/}/auth/v1/health" \
              --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}"
          )"
          http_status="${response_meta%% *}"
          content_type="${response_meta#* }"
          if [ "$http_status" != "200" ] || [[ "$content_type" != application/json* ]]; then
            echo "Supabase Auth-Health lieferte keinen sicheren Erfolg (HTTP ${http_status})."
            exit 1
          fi
          if ! node -e '
            const { readFileSync } = require("node:fs");
            let body;
            try { body = JSON.parse(readFileSync(process.argv[1], "utf8")); }
            catch { process.exit(2); }
            const keys = Object.keys(body || {}).sort().join(",");
            const strings = [body?.description, body?.name, body?.version];
            if (keys !== "description,name,version"
                || strings.some((value) => typeof value !== "string" || !value.trim())) {
              process.exit(3);
            }
          ' "$response_file"; then
            echo "Supabase Auth-Health lieferte keinen gueltigen Antwortvertrag."
            exit 1
          fi
          echo "keep-alive ok"
