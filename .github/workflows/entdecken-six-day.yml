name: Entdecken täglich und Radar im Sechs-Tage-Takt

on:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  radar-six-day-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: kinodreieck-radar-six-day
      cancel-in-progress: false
    steps:
      - name: Faellige Radar-Ziele im 144-Stunden-Takt seriell pruefen
        timeout-minutes: 30
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_RADAR_SCHEDULER: ${{ secrets.SUPABASE_RADAR_SCHEDULER }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_RADAR_SCHEDULER" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_RADAR_SCHEDULER nicht gesetzt."
            exit 1
          fi
          case "$SUPABASE_RADAR_SCHEDULER" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_RADAR_SCHEDULER hat nicht das erwartete Secret-Key-Format."
              exit 1
              ;;
          esac

          for claim_number in $(seq 1 10); do
            http_status="$(
              curl --silent --show-error \
                --request POST \
                --connect-timeout 10 \
                --max-time 150 \
                --output /dev/null \
                --write-out "%{http_code}" \
                "${SUPABASE_URL%/}/functions/v1/radar-websearch-task" \
                --header "apikey: ${SUPABASE_RADAR_SCHEDULER}" \
                --header "x-kd-radar-refresh: scheduled-144h-v1"
            )"
            if [ "$http_status" = "204" ]; then
              exit 0
            fi
            if [ "$http_status" != "200" ]; then
              echo "::error::Radar-Lauf endete mit HTTP ${http_status}; kein Retry."
              exit 1
            fi
          done

  entdecken-six-day-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: kinodreieck-entdecken-daily
      cancel-in-progress: false
    steps:
      - name: Entdecken taeglich um 02 Uhr UTC faelligkeitsgeprueft anstossen
        timeout-minutes: 3
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY nicht gesetzt."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          response_meta="$(
            curl --silent --show-error \
              --request POST \
              --connect-timeout 10 \
              --max-time 150 \
              --output "$response_file" \
              --write-out "%{http_code} %{content_type}" \
              "${SUPABASE_URL%/}/functions/v1/entdecken-daily-task" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "x-kd-entdecken-refresh: scheduled-24h-v1"
          )"

          http_status="${response_meta%% *}"
          content_type="${response_meta#* }"
          if [ "$http_status" != "200" ] || [[ "$content_type" != application/json* ]]; then
            echo "::error::Entdecken antwortete nicht mit HTTP 200 JSON (HTTP ${http_status})."
            exit 1
          fi

          if ! outcome="$(node -e '
            const { readFileSync } = require("node:fs");
            let body;
            try { body = JSON.parse(readFileSync(process.argv[1], "utf8")); }
            catch { process.exit(2); }
            const statuses = new Set(["fresh", "stale", "empty"]);
            const modes = new Set(["structured", "partial", "degraded"]);
            const refreshStatuses = new Set([
              "refreshed", "not_due", "outside_window", "in_progress", "held", "failed",
            ]);
            const countsValid = Number.isInteger(body?.providerRequests) && body.providerRequests === 0
              && Number.isInteger(body?.searchRequests) && body.searchRequests === 0
              && Number.isInteger(body?.sourceRequests) && body.sourceRequests >= 0 && body.sourceRequests <= 5
              && Number.isInteger(body?.wikidataRequests) && body.wikidataRequests >= 0 && body.wikidataRequests <= 24
              && Number.isInteger(body?.writes) && body.writes >= 0 && body.writes <= 1;
            if (!body || body.ok !== true || !statuses.has(body.status)
                || !modes.has(body.responseMode) || !countsValid
                || !body.refresh || body.refresh.requested !== true
                || body.refresh.mode !== "scheduled"
                || !refreshStatuses.has(body.refresh.status)
                || !Number.isInteger(body.refresh.attemptCount)
                || body.refresh.attemptCount < 0 || body.refresh.attemptCount > 1
                || body.refresh.maxAttempts !== 1) process.exit(3);
            const items = Array.isArray(body?.feed?.items) ? body.feed.items : [];
            const sourceIds = Array.isArray(body?.feed?.sourceIds) ? [...body.feed.sourceIds].sort() : [];
            const itemSourceIds = [...new Set(items.map((item) => item?.sourceId))].sort();
            const marketCounts = items.reduce((counts, item) => {
              const key = item?.availability?.market === "cinema" ? "cinema"
                : item?.availability?.service === "Netflix" ? "netflix"
                  : item?.availability?.service === "Prime Video" ? "prime"
                    : item?.availability?.service === "Disney+" ? "disney"
                      : item?.availability?.service === "Apple TV+" ? "apple" : "unknown";
              counts[key] = (counts[key] || 0) + 1;
              return counts;
            }, {});
            const fullMixFeedValid = Number.isInteger(body?.feed?.format)
              && body.feed.format >= 7
              && items.length === 50
              && marketCounts.cinema === 15
              && marketCounts.netflix === 10
              && marketCounts.prime === 10
              && marketCounts.disney === 10
              && marketCounts.apple === 5
              && !marketCounts.unknown
              && sourceIds.length === 5
              && JSON.stringify(itemSourceIds) === JSON.stringify(sourceIds);
            const fullMixReadbackValid = fullMixFeedValid
              && body?.feedReadback?.itemCount === 50
              && body.feedReadback.sourceCount === 5
              && Array.isArray(body.feedReadback.sourceIds)
              && JSON.stringify([...body.feedReadback.sourceIds].sort()) === JSON.stringify(sourceIds)
              && body.feedReadback.rightsStatus === "owner_private"
              && body.feedReadback.providerRequests === 0;
            if (body.refresh.status === "refreshed" && body.status === "fresh"
                && body.sourceRequests >= 2 && body.writes === 1 && fullMixReadbackValid) {
              process.stdout.write("refreshed");
            } else if (body.refresh.status === "failed" && body.responseMode === "degraded"
                && body.writes === 0) {
              process.stdout.write("failed");
            } else if (body.refresh.status === "not_due" && body.status === "fresh"
                && body.sourceRequests === 0 && body.wikidataRequests === 0 && body.writes === 0
                && fullMixFeedValid) {
              process.stdout.write("not_due");
            } else if (["outside_window", "in_progress", "held"].includes(body.refresh.status)
                && body.sourceRequests === 0 && body.wikidataRequests === 0 && body.writes === 0) {
              process.stdout.write(body.refresh.status);
            } else process.exit(4);
          ' "$response_file")"; then
            echo "::error::Entdecken lieferte keinen gueltigen providerfreien Produktvertrag."
            exit 1
          fi

          case "$outcome" in
            refreshed) echo "Entdecken: neuer 50-Titel-Stand aus fuenf Bereichen gespeichert." ;;
            not_due) echo "Entdecken: vollstaendiger Fuenf-Bereiche-Stand wurde heute bereits erfolgreich verarbeitet." ;;
            outside_window)
              echo "::error::Entdecken: der Server hat den verspaeteten Tageslauf wegen der Uhrzeit verworfen."
              exit 1
              ;;
            in_progress)
              echo "::error::Entdecken: Lauf endete ohne Readback, weil eine Lease aktiv war."
              exit 1
              ;;
            held)
              echo "::error::Entdecken: Claim blieb ohne belegten Tageserfolg gesperrt."
              exit 1
              ;;
            failed)
              echo "::error::Entdecken: Quellen-/Anreicherungsversuch endete degraded; kein Retry in diesem Fenster."
              exit 1
              ;;
          esac
