# Supabase-CLI-Konfiguration — bewusst MINIMAL.
#
# Diese Datei existiert nur, damit `supabase functions deploy` die
# Funktionseinstellungen versioniert vorfindet. Sie bildet NICHT den
# Gesamtzustand des Projekts ab.
#
# WARNUNG: Niemals `supabase config push` oder `supabase db push` ausführen.
# Beides würde aus dieser unvollständigen Datei heraus Live-Einstellungen
# beziehungsweise die Migrationshistorie überschreiben. Schemaänderungen laufen
# in diesem Projekt ausschließlich von Hand über den SQL-Editor
# (Laufprotokoll: supabase/migrations/LIESMICH.md).

project_id = "bscjgwcntapobyxsiyce"

[functions.ai-task]
# Plattformprüfung des Sitzungstokens bleibt an — als Vorhut.
# Die Funktion prüft den Aufrufer zusätzlich selbst (role == "authenticated"),
# weil die Plattformprüfung laut Doku bei einer Rotation auf asymmetrische
# Signaturschlüssel abgeschaltet werden müsste. Fällt sie weg, schützt die
# eigene Prüfung weiter.
verify_jwt = true

[functions.radar-websearch-task]
# New API Keys sind keine JWTs. Der geplante Scheduler authentifiziert sich
# deshalb ausschließlich im Handler über einen internen sb_secret_-API-Key;
# Browseraufrufe bleiben dort an die eigene authenticated-Claims-Prüfung
# gebunden.
verify_jwt = false

[functions.entdecken-daily-task]
# Globaler, nicht personalisierter Nur-Lese-Endpunkt. Die Function prueft den
# oeffentlichen Projekt-Key selbst. GET bleibt ein reiner Readback; nur der
# explizite service-role-/Owner-POST darf den gezaunten Wochenrefresh claimen.
verify_jwt = false

[functions.private-mail-request]
# Der Browserweg ist ausschliesslich fuer angemeldete Konten bestimmt. Die
# Plattform prueft das Sitzungstoken vor dem Handler; der Handler prueft Claims,
# User-ID und aktiven Accountzugang zusaetzlich selbst.
verify_jwt = true

[functions.automatic-ai-check]
# New API Keys sind keine JWTs. Der periodische Checker akzeptiert deshalb nur
# seinen bodylosen Serverrequest mit exaktem Header und passendem sb_secret_-Key.
verify_jwt = false
