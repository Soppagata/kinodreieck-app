name: Deploy kd-api function set

on:
  workflow_dispatch:
    inputs:
      target:
        description: Gebundene GitHub-Umgebung
        required: true
        type: choice
        options:
          - staging
          - production
      source_commit:
        description: Exakter geprüfter 40-stelliger Kandidatencommit
        required: true
        type: string
      release_id:
        description: Nicht geheime eindeutige Release-ID
        required: true
        type: string
      enabled:
        description: API-Gate; beim ersten Deploy false lassen
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Staging und Production teilen derzeit dasselbe Supabase-Projekt.
  group: kinodreieck-kd-api-shared-supabase
  cancel-in-progress: false

jobs:
  deploy-kd-api:
    name: kd-api ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    env:
      EXPECTED_PROJECT_REF: bscjgwcntapobyxsiyce
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TARGET_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Commit und Zielprojekt binden
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          node --input-type=module -e '
            const url = new URL(process.env.TARGET_SUPABASE_URL);
            if (url.protocol !== "https:" || url.hostname !== `${process.env.EXPECTED_PROJECT_REF}.supabase.co` || url.pathname !== "/") process.exit(1);
          '
      - name: Lieferhülle fokussiert prüfen
        run: npm run test:kd-api:release
      - name: Quell-, Config- und Schema-Nachweis erzeugen
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          node tools/kd-api-release-info.mjs
          --source-commit "$EXPECTED_SOURCE_COMMIT"
          --release-id "$RELEASE_ID"
          > "$RUNNER_TEMP/kd-api-release-info.json"
      - name: Nicht geheimen Liefernachweis sichern
        uses: actions/upload-artifact@v4
        with:
          name: kd-api-release-${{ inputs.release_id }}
          path: ${{ runner.temp }}/kd-api-release-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Gebundene Function-Konfiguration setzen
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          umask 077
          printf 'KD_API_SOURCE_COMMIT=%s\nKD_API_RELEASE_ID=%s\nKD_API_ENABLED=%s\n' \
            "$EXPECTED_SOURCE_COMMIT" "$RELEASE_ID" "false" \
            > "$RUNNER_TEMP/kd-api-function.env"
          ./node_modules/.bin/supabase secrets set \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --env-file "$RUNNER_TEMP/kd-api-function.env" \
            --output json > "$RUNNER_TEMP/kd-api-secrets-set.json"
      - name: Abhängige ai-task-Function aus demselben Commit deployen
        run: >-
          ./node_modules/.bin/supabase functions deploy ai-task
          --project-ref "$EXPECTED_PROJECT_REF"
          --use-api
          --jobs 1
          --output-format json
      - name: ai-task-Buildmarker erst nach erfolgreichem Deploy setzen
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          umask 077
          printf 'KD_FUNCTION_BUILD_VERSION=%s\n' "$EXPECTED_SOURCE_COMMIT" \
            > "$RUNNER_TEMP/ai-task-marker.env"
          ./node_modules/.bin/supabase secrets set \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --env-file "$RUNNER_TEMP/ai-task-marker.env" \
            --output json > "$RUNNER_TEMP/ai-task-marker-set.json"
      - name: ai-task-Version über vorhandenen providerfreien Owner-Health rücklesen
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          KD_READBACK_OWNER_USER: ${{ secrets.KD_READBACK_OWNER_USER }}
          KD_READBACK_OWNER_PASSWORD: ${{ secrets.KD_READBACK_OWNER_PASSWORD }}
          KD_READBACK_MAIL_DOMAIN: ${{ vars.MAIL_DOMAIN }}
          KD_READBACK_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          TARGET_APP_URL: ${{ vars.APP_URL }}
        run: |
          node --input-type=module -e '
            import { liesOwnerFunctionBuildMarker } from "./tools/live_function_readback.mjs";
            await liesOwnerFunctionBuildMarker({
              expectedBuildVersion: process.env.EXPECTED_SOURCE_COMMIT,
              expectedProjectRef: process.env.EXPECTED_PROJECT_REF,
              lokaleKonfig: {
                KD_SB_URL: process.env.TARGET_SUPABASE_URL,
                KD_SB_ANON: process.env.KD_READBACK_PUBLISHABLE_KEY,
                KD_OWNER_USER: process.env.KD_READBACK_OWNER_USER,
                KD_MAIL_DOMAIN: process.env.KD_READBACK_MAIL_DOMAIN,
                KD_AI_FUNKTION: "ai-task",
                KD_ORIGIN: process.env.TARGET_APP_URL,
              },
              keychainLeser: () => process.env.KD_READBACK_OWNER_PASSWORD,
            });
          '
      - name: Ausschließlich kd-api deployen
        run: >-
          ./node_modules/.bin/supabase functions deploy kd-api
          --project-ref "$EXPECTED_PROJECT_REF"
          --no-verify-jwt
          --use-api
          --jobs 1
          --output-format json
      - name: Geschlossenen Function-Stand read-only rücklesen
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          node tools/kd-api-readback.mjs
          --base-url "$TARGET_SUPABASE_URL/functions/v1/kd-api"
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --expected-release-id "$RELEASE_ID"
          --expect-enabled false
      - name: Zweifunctionsatz read-only aus Management rücklesen
        run: |
          ./node_modules/.bin/supabase functions list \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --output json > "$RUNNER_TEMP/kd-api-functions.json"
          node tools/kd-api-function-set-readback.mjs \
            --snapshot "$RUNNER_TEMP/kd-api-functions.json"
      - name: Gate nach geschlossenem Readback öffnen
        if: ${{ inputs.enabled }}
        run: |
          umask 077
          printf 'KD_API_ENABLED=true\n' > "$RUNNER_TEMP/kd-api-enable.env"
          ./node_modules/.bin/supabase secrets set \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --env-file "$RUNNER_TEMP/kd-api-enable.env" \
            --output json > "$RUNNER_TEMP/kd-api-enable-set.json"
          ./node_modules/.bin/supabase functions deploy kd-api \
            --project-ref "$EXPECTED_PROJECT_REF" \
            --no-verify-jwt \
            --use-api \
            --jobs 1 \
            --output-format json
      - name: Finales Gate read-only rücklesen
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          KD_API_ENABLED_INPUT: ${{ inputs.enabled }}
        run: >-
          node tools/kd-api-readback.mjs
          --base-url "$TARGET_SUPABASE_URL/functions/v1/kd-api"
          --expected-source-commit "$EXPECTED_SOURCE_COMMIT"
          --expected-release-id "$RELEASE_ID"
          --expect-enabled "$KD_API_ENABLED_INPUT"
