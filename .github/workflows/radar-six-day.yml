name: Radar – fällige Ziele prüfen

on:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Harte Wirkungssperre ausweisen
        run: |
          {
            echo "## Radar: wirkungsgesperrt"
            echo
            echo "Der Radar-Job ist im Workflow hart mit if: false gesperrt. Zusätzlich muss später die Repository-Variable KD_RADAR_SCHEDULE_ENABLED exakt true sein."
            echo "Es wurde kein authentifizierter Request und kein Anbieterrequest gestartet."
          } >> "$GITHUB_STEP_SUMMARY"

  radar-six-day-trigger:
    needs: activation
    if: ${{ false && vars.KD_RADAR_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: kinodreieck-radar-six-day
      cancel-in-progress: false
    steps:
      - name: Faellige Radar-Ziele im 144-Stunden-Takt seriell pruefen
        timeout-minutes: 30
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_RADAR_SCHEDULER: ${{ secrets.SUPABASE_RADAR_SCHEDULER }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_RADAR_SCHEDULER" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_RADAR_SCHEDULER nicht gesetzt."
            exit 1
          fi
          case "$SUPABASE_RADAR_SCHEDULER" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_RADAR_SCHEDULER hat nicht das erwartete Secret-Key-Format."
              exit 1
              ;;
          esac

          for claim_number in $(seq 1 10); do
            http_status="$(
              curl --silent --show-error \
                --request POST \
                --connect-timeout 10 \
                --max-time 150 \
                --output /dev/null \
                --write-out "%{http_code}" \
                "${SUPABASE_URL%/}/functions/v1/radar-websearch-task" \
                --header "apikey: ${SUPABASE_RADAR_SCHEDULER}" \
                --header "x-kd-radar-refresh: scheduled-144h-v1"
            )"
            if [ "$http_status" = "204" ]; then
              exit 0
            fi
            if [ "$http_status" != "200" ]; then
              echo "::error::Radar-Lauf endete mit HTTP ${http_status}; kein Retry."
              exit 1
            fi
          done
