name: Supabase Keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anon-Read gegen kd_store
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY nicht gesetzt."; exit 1
          fi
          curl -fsS "${SUPABASE_URL}/rest/v1/kd_store?scope=eq.demo&select=key&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            && echo "keep-alive ok"

  entdecken-weekly-trigger:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Entdecken-Wochenfeed planmaessig anstossen
        if: ${{ github.event_name == 'schedule' }}
        timeout-minutes: 3
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY nicht gesetzt."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          response_meta="$(
            curl --silent --show-error \
              --request POST \
              --connect-timeout 10 \
              --max-time 150 \
              --output "$response_file" \
              --write-out "%{http_code} %{content_type}" \
              "${SUPABASE_URL%/}/functions/v1/entdecken-daily-task" \
              --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --header "x-kd-entdecken-refresh: scheduled-v1"
          )"

          http_status="${response_meta%% *}"
          content_type="${response_meta#* }"
          if [ "$http_status" != "200" ] || [[ "$content_type" != application/json* ]]; then
            echo "::error::Entdecken-Wochenfeed antwortete nicht mit HTTP 200 JSON (HTTP ${http_status})."
            exit 1
          fi

          if ! outcome="$(node -e '
            const { readFileSync } = require("node:fs");
            let body;
            try { body = JSON.parse(readFileSync(process.argv[1], "utf8")); }
            catch { process.exit(2); }
            const statuses = new Set(["fresh", "stale", "empty"]);
            const modes = new Set(["structured", "partial", "degraded"]);
            const refreshStatuses = new Set([
              "refreshed", "already_fresh", "in_progress", "cooldown",
              "exhausted", "held", "failed",
            ]);
            if (!body || body.ok !== true || !statuses.has(body.status)
                || !modes.has(body.responseMode)
                || !body.refresh || body.refresh.requested !== true
                || body.refresh.mode !== "scheduled"
                || !refreshStatuses.has(body.refresh.status)
                || !Number.isInteger(body.refresh.attemptCount)
                || body.refresh.attemptCount < 0 || body.refresh.attemptCount > 3
                || body.refresh.maxAttempts !== 3
                || !Number.isInteger(body.providerRequests)
                || body.providerRequests < 0 || body.providerRequests > 1
                || !Number.isInteger(body.searchRequests)
                || body.searchRequests < 0 || body.searchRequests > 2
                || !Number.isInteger(body.writes) || body.writes < 0 || body.writes > 1) {
              process.exit(3);
            }
            if (body.refresh.status === "failed" && body.responseMode === "degraded"
                && body.writes === 0) process.stdout.write("failed");
            else if (["already_fresh", "in_progress", "cooldown", "exhausted", "held"]
                .includes(body.refresh.status)
                && body.providerRequests === 0 && body.searchRequests === 0
                && body.writes === 0) process.stdout.write(body.refresh.status);
            else if (body.refresh.status === "refreshed" && body.providerRequests === 1
                && body.writes === 1 && body.status === "fresh") {
              process.stdout.write("refreshed");
            } else process.exit(4);
          ' "$response_file")"; then
            echo "::error::Entdecken-Wochenfeed lieferte keinen gueltigen Produktvertrag."
            exit 1
          fi

          case "$outcome" in
            refreshed) echo "Entdecken-Wochenfeed: Wochenrefresh gespeichert." ;;
            already_fresh) echo "Entdecken-Wochenfeed: aktueller Wochenfeed bereits vorhanden; kein Providerrequest." ;;
            in_progress) echo "Entdecken-Wochenfeed: ein Refresh haelt die aktive Lease; kein Providerrequest." ;;
            cooldown) echo "::warning::Entdecken-Wochenfeed: spaeterer Recoveryversuch wartet auf Cooldown; kein Retry in diesem Lauf." ;;
            exhausted) echo "::warning::Entdecken-Wochenfeed: Wochenkontingent erschoepft; kein Providerrequest." ;;
            held) echo "Entdecken-Wochenfeed: Claim nicht frei; kein Providerrequest." ;;
            failed) echo "::warning::Entdecken-Wochenfeed: begrenzter Versuch endete degraded; kein Retry." ;;
          esac
